<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f0df">
<title>숲마을에서 온 엽서</title>
<style>
:root{color-scheme:light;--ink:#26372c;--muted:#596253;--paper:#fffaf0;--rim:#dbccb3;--green:#294d3b;--gold:#ecba67;font-family:system-ui,"Malgun Gothic",sans-serif;color:var(--ink);background:#eee6d6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fdf6e7,#eee6d6 65%);min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,.scene:focus-visible{outline:3px solid #a66c20;outline-offset:3px}button:disabled{cursor:default;opacity:.55}
main{width:min(100%,516px);margin:auto;padding:clamp(9px,2.8vw,20px) clamp(9px,3vw,18px) max(14px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 1px 9px;border-bottom:1px solid var(--rim)}
h1,h2,p{margin:0}h1{font-size:clamp(19px,5vw,29px);letter-spacing:-.065em}
.location{display:flex;align-items:center;justify-content:space-between;padding:8px 1px;gap:6px}.location h2{font-size:clamp(15px,4vw,19px);letter-spacing:-.035em}.location p{font-size:12px;color:var(--muted)}
.scene{position:relative;height:min(57svh,610px);min-height:255px;overflow:hidden;border:1px solid #9f795c;border-radius:14px;background:#433a29;touch-action:none;user-select:none;isolation:isolate}
.world{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}.world img{display:block;width:100%;height:100%;pointer-events:none}
.zoom{position:absolute;right:5px;bottom:6px;display:flex;gap:4px;z-index:2;touch-action:manipulation}
.zoom button{border:1px solid #e4d6bc;background:#fff9ec;color:#26372c;min-width:36px;height:36px;border-radius:8px;padding:2px 6px;font-size:13px;box-shadow:0 1px 6px #20170a44}
.zoom button:disabled{background:#e9deca;opacity:.8}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.toolbar p{font-size:12px;color:var(--muted);line-height:1.4}
.pill,.primary{border:1px solid var(--rim);border-radius:9px;background:var(--paper);padding:8px 10px;font-size:12px;font-weight:700;min-height:36px;white-space:nowrap}
.primary{background:var(--green);color:#fff9ed;border-color:var(--green);padding:10px 15px;font-size:14px}
.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin:0;gap:6px;list-style:none}
.target{position:relative;text-align:center;background:var(--paper);border:1px solid var(--rim);border-radius:10px;padding:6px 2px;font-size:clamp(10px,2.9vw,13px);font-weight:700;white-space:nowrap}
.target img{display:block;width:clamp(33px,10vw,53px);height:clamp(33px,10vw,53px);margin:0 auto 4px;border-radius:6px;object-fit:cover}
.target.found{background:#e5ecdf;border-color:#9baa91}.target.found img{opacity:.65}.check{position:absolute;right:4px;top:4px;border-radius:100%;background:var(--green);color:white;width:18px;line-height:18px;font-size:12px}
#phase-action{display:block;margin:8px 0 0 auto}
dialog{width:min(365px,calc(100% - 28px));max-height:calc(100% - 28px);padding:17px;border-radius:15px;border:1px solid var(--rim);color:var(--ink);background:var(--paper);box-shadow:0 12px 35px #25190755}dialog::backdrop{background:#2923199c}
.dialog-head,.dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.dialog-head h2{font-size:19px}.dialog-actions{justify-content:flex-end;margin-top:13px}.postcard{width:100%;height:min(35vh,230px);object-fit:cover;object-position:center 47%;border:6px solid #fff;border-radius:7px;box-shadow:0 0 0 1px var(--rim);margin:12px 0 8px}
dialog p{font-size:14px;line-height:1.55}#album-caption{margin-top:4px}.effect,.hint-box{position:absolute;pointer-events:none}
.effect{width:23px;height:23px;z-index:1;transform:translate(-50%,-50%);border-radius:50%;animation:fade .58s ease-out forwards}.miss{border:2px solid #dfdcd2;background:#4a47472b}.spark{color:#fff4a4;text-shadow:0 0 5px #583306,0 0 13px #f8db70;font-size:30px;line-height:23px;text-align:center}
.hint-box{border:2px solid #ffeb9d;background:#ffe8a32e;border-radius:10px;box-shadow:0 0 0 1px #47311877;animation:hint 3.2s forwards}
@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
@keyframes hint{0%,18%,80%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.effect,.hint-box{animation-name:none}}
[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<main>
  <header><h1>숲마을에서 온 엽서</h1><button class="pill" id="album-open">엽서 앨범 <span id="album-count">0/1</span></button></header>
  <section aria-labelledby="location-title">
    <div class="location"><h2 id="location-title">나뭇잎 우체국</h2><p><span id="phase-label"></span> · <strong id="progress"></strong></p></div>
    <div class="scene" id="scene">
      <div class="world" id="world"><img id="art" alt="햇살 드는 나무 우체국에서 다람쥐 우체부가 편지를 정리하는 그림" draggable="false"></div>
      <div class="zoom" aria-label="그림 확대 조절"><button id="minus" aria-label="축소">−</button><button id="plus" aria-label="확대">+</button><button id="fit">전체</button></div>
    </div>
    <div class="toolbar"><p id="instructions">그림에서 물건을 눌러 찾으세요.<br>두 손가락으로 확대할 수 있어요.</p><button class="pill" id="hint">구역 힌트 <span id="hint-count"></span></button></div>
    <ul aria-label="찾을 물건" class="targets" id="targets"></ul>
    <button class="primary" id="phase-action" hidden></button>
    <p id="status" class="sr" role="status"></p>
    <p id="save-warning" hidden>이 브라우저에서 진행 상태를 저장할 수 없습니다.</p>
  </section>
</main>
<dialog id="album" aria-labelledby="album-title">
  <div class="dialog-head"><h2 id="album-title">엽서 앨범</h2><button class="pill" id="album-close" aria-label="앨범 닫기">닫기</button></div>
  <div id="postcard" hidden><img class="postcard" id="postcard-art" alt="다람쥐 우체부가 편지를 정리하는 나뭇잎 우체국 엽서"><p><strong>나뭇잎 우체국</strong></p><p id="album-caption">“작은 편지도 먼 숲까지 닿기를.”</p></div>
  <p id="album-empty">첫 방문 물건을 모두 찾으면 나뭇잎 우체국 엽서를 받습니다.</p>
  <div class="dialog-actions"><button class="primary" id="revisit" hidden>우체국 다시 방문</button></div>
</dialog>

    : '그림에서 물건을 눌러 찾으세요.<br>두 손가락으로 확대할 수 있어요.';
  find('phase-action').hidden = !done;
  find('phase-action').textContent = state.phase ? '엽서 보기' : '재방문 시작';
  find('targets').replaceChildren(...phases[state.phase].map(item => {
    const found = state.found[state.phase].includes(item.id);
    const tile = document.createElement('li');
    tile.className = found ? 'target found' : 'target';
    const icon = new Image();
    icon.src = item.icon;
    icon.alt = '';
    tile.append(icon, item.name);
    if (found) {
      const check = document.createElement('span');
      check.className = 'check';
      check.setAttribute('aria-hidden', 'true');
      check.textContent = '✓';
      const note = document.createElement('span');
      note.className = 'sr';
      note.textContent = ' 찾음';
      tile.append(check, note);
    }
    return tile;
  }));
}

function openAlbum() {
  find('postcard').hidden = !complete(0);
  find('album-empty').hidden = complete(0);
  find('revisit').hidden = !complete(0) || complete(1);
  find('revisit').textContent = state.phase ? '재방문 이어서 찾기' : '우체국 다시 방문';
  if (!album.open) album.showModal();
}

function startRevisit() {
  if (!complete(0)) return;
  if (album.open) album.close();
  if (state.phase === 1) return;
  state.phase = 1;
  hintCursor = 0;
  clearHint();
  resetCamera();
  save();
  render();
  find('status').textContent = '재방문에서 새로운 물건 네 개를 찾아보세요.';
}

function bound(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function draw() {
  const width = camera.width * camera.scale;
  const height = camera.height * camera.scale;
  const availableWidth = scene.clientWidth;
  const availableHeight = scene.clientHeight;
  camera.x = width <= availableWidth ? (availableWidth - width) / 2
    : bound(camera.x, availableWidth - width, 0);
  camera.y = height <= availableHeight ? (availableHeight - height) / 2
    : bound(camera.y, availableHeight - height, 0);
  world.style.transform = `translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;
  find('plus').disabled = camera.scale >= maxScale;
  find('minus').disabled = camera.scale <= 1;
  find('fit').disabled = camera.scale <= 1;
}

function resetCamera() {
  const fit = Math.min(scene.clientWidth / artSize.width, scene.clientHeight / artSize.height);
  camera = { width: artSize.width * fit, height: artSize.height * fit, scale: 1, x: 0, y: 0 };
  world.style.width = `${camera.width}px`;
  world.style.height = `${camera.height}px`;
  draw();
}

function zoomAt(scale, before, after = before) {
  const next = bound(scale, 1, maxScale);
  const factor = next / camera.scale;
  camera.x = after.x - (before.x - camera.x) * factor;
  camera.y = after.y - (before.y - camera.y) * factor;
  camera.scale = next;
  draw();
}

function center() {
  return { x: scene.clientWidth / 2, y: scene.clientHeight / 2 };
}

function local(event) {
  const box = scene.getBoundingClientRect();
  return { x: event.clientX - box.left - scene.clientLeft, y: event.clientY - box.top - scene.clientTop };
}

function showEffect(point, correct) {
  const effect = document.createElement('span');
  effect.className = correct ? 'effect spark' : 'effect miss';
  effect.style.left = `${point.x}px`;
  effect.style.top = `${point.y}px`;
  effect.textContent = correct ? '✦' : '';
  effect.setAttribute('aria-hidden', 'true');
  scene.append(effect);
  setTimeout(() => effect.remove(), 600);
}

function tap(point) {
  if (complete(state.phase)) return;
  const x = ((point.x - camera.x) / (camera.width * camera.scale)) * artSize.width;
  const y = ((point.y - camera.y) / (camera.height * camera.scale)) * artSize.height;
  if (x < 0 || y < 0 || x > artSize.width || y > artSize.height) return;
  const item = phases[state.phase].find(({ id, hit: [left, top, right, bottom] }) => {
    if (x < left || x > right || y < top || y > bottom) return false;
    if (id !== 'quill') return true;
    const featherCenter = 769 + 0.56 * (x - 107);
    return Math.abs(y - featherCenter) <= (x < 225 ? 40 : 25);
  });
  if (!item) {
    showEffect(point, false);
    return;
  }
  if (state.found[state.phase].includes(item.id)) return;
  state.found[state.phase].push(item.id);
  if (hintMarker?.dataset.item === item.id) clearHint();
  save();
  render();
  showEffect(point, true);
  find('status').textContent = `${item.name} 발견! ${state.found[state.phase].length}/4`;
  if (state.phase === 0 && complete(0)) {
    setTimeout(() => {
      if (state.phase === 0 && !album.open) openAlbum();
    }, 600);
  }
}

function clearHint() {
  hintMarker?.remove();
  hintMarker = undefined;
}

function hint() {
  if (find('hint').disabled) return;
  const remaining = phases[state.phase].filter(item => !state.found[state.phase].includes(item.id));
  const item = remaining[hintCursor % remaining.length];
  hintCursor += 1;
  state.hints[state.phase] += 1;
  save();
  render();
  clearHint();
  if (camera.scale !== 1) resetCamera();
  const [left, top, right, bottom] = item.zone;
  const marker = document.createElement('span');
  marker.className = 'hint-box';
  marker.dataset.item = item.id;
  Object.assign(marker.style, {
    left: `${left / artSize.width * 100}%`, top: `${top / artSize.height * 100}%`,
    width: `${(right - left) / artSize.width * 100}%`, height: `${(bottom - top) / artSize.height * 100}%`,
  });
  world.append(marker);
  hintMarker = marker;
  find('status').textContent = `힌트 구역은 ${item.area}입니다. 남은 힌트 ${hintLimit - state.hints[state.phase]}회.`;
  setTimeout(() => {
    if (hintMarker === marker) clearHint();
  }, 3200);
}

const pointers = new Map();
let tapCandidate = null;

function pair(points) {
  const [a, b] = points;
  return { center: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
    distance: Math.hypot(b.x - a.x, b.y - a.y) };
}

scene.addEventListener('pointerdown', event => {
  if (event.target.closest('button') || event.button !== 0) return;
  const point = local(event);
  pointers.set(event.pointerId, point);
  scene.setPointerCapture(event.pointerId);
  tapCandidate = pointers.size === 1 ? { id: event.pointerId, start: point } : null;
});

scene.addEventListener('pointermove', event => {
  const last = pointers.get(event.pointerId);
  if (!last) return;
  const point = local(event);
  if (pointers.size === 2) {
    const before = pair([...pointers.values()]);
    pointers.set(event.pointerId, point);
    const after = pair([...pointers.values()]);
    if (before.distance > 0) zoomAt(camera.scale * after.distance / before.distance, before.center, after.center);
    return;
  }
  pointers.set(event.pointerId, point);
  if (pointers.size !== 1) return;
  let origin = last;
  if (tapCandidate) {
    const start = tapCandidate.start;
    if (Math.hypot(point.x - start.x, point.y - start.y) <= 7) return;
    tapCandidate = null;
    origin = start;
  }
  camera.x += point.x - origin.x;
  camera.y += point.y - origin.y;
  draw();
});

function endPointer(event) {
  if (!pointers.has(event.pointerId)) return;
  pointers.delete(event.pointerId);
  if (tapCandidate?.id !== event.pointerId) return;
  const { start } = tapCandidate;
  tapCandidate = null;
  if (event.type !== 'pointerup') return;
  const point = local(event);
  if (Math.hypot(point.x - start.x, point.y - start.y) <= 7) tap(point);
}

for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  scene.addEventListener(name, endPointer);
}
find('plus').onclick = () => zoomAt(camera.scale * 1.5, center());
find('minus').onclick = () => zoomAt(camera.scale / 1.5, center());
find('fit').onclick = resetCamera;
find('hint').onclick = hint;
find('album-open').onclick = openAlbum;
find('album-close').onclick = () => album.close();
find('revisit').onclick = startRevisit;
find('phase-action').onclick = () => state.phase === 0 ? startRevisit() : openAlbum();
new ResizeObserver(resetCamera).observe(scene);
load();
render();
resetCamera();
</script>
</body>
</html>
