<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f0df">
<title>숲마을에서 온 엽서</title>
<style>
:root{color-scheme:light;--ink:#26372c;--muted:#596253;--paper:#fffaf0;--rim:#dbccb3;--green:#294d3b;--gold:#ecba67;font-family:system-ui,"Malgun Gothic",sans-serif;color:var(--ink);background:#eee6d6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fdf6e7,#eee6d6 65%);min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,.scene:focus-visible{outline:3px solid #a66c20;outline-offset:3px}button:disabled{cursor:default;opacity:.55}
main{width:min(100%,516px);margin:auto;padding:clamp(9px,2.8vw,20px) clamp(9px,3vw,18px) max(14px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 1px 9px;border-bottom:1px solid var(--rim)}
h1,h2,p{margin:0}h1{font-size:clamp(19px,5vw,29px);letter-spacing:-.065em}
.location{display:flex;align-items:center;justify-content:space-between;padding:8px 1px;gap:6px}.location h2{font-size:clamp(15px,4vw,19px);letter-spacing:-.035em}.location p{font-size:12px;color:var(--muted)}
.scene{position:relative;height:min(57svh,610px);min-height:255px;overflow:hidden;border:1px solid #9f795c;border-radius:14px;background:#433a29;touch-action:none;user-select:none;isolation:isolate}
.world{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}.world img{display:block;pointer-events:none}.world #art{width:100%;height:100%}.world .scene-object{position:absolute}
.world .placed-object img{position:absolute;inset:0;width:100%;height:100%}
.contact-shadow{position:absolute;left:8%;bottom:-7%;width:86%;height:16%;
  transform:skewX(-15deg);background:radial-gradient(ellipse at center,#23180775 0%,#2a1b0c44 38%,transparent 72%);}

.zoom{position:absolute;right:5px;bottom:6px;display:flex;gap:4px;z-index:2;touch-action:manipulation}
.zoom button{border:1px solid #e4d6bc;background:#fff9ec;color:#26372c;min-width:36px;height:36px;border-radius:8px;padding:2px 6px;font-size:13px;box-shadow:0 1px 6px #20170a44}
.zoom button:disabled{background:#e9deca;opacity:.8}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.toolbar p{font-size:12px;color:var(--muted);line-height:1.4}
.pill,.primary{border:1px solid var(--rim);border-radius:9px;background:var(--paper);padding:8px 10px;font-size:12px;font-weight:700;min-height:36px;white-space:nowrap}
.arcade-home{display:inline-flex;align-items:center;color:inherit;text-decoration:none}
.arcade-home:focus-visible{outline:3px solid #a66c20;outline-offset:3px}
.primary{background:var(--green);color:#fff9ed;border-color:var(--green);padding:10px 15px;font-size:14px}
.targets{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(70px,calc((100% - 18px)/4));gap:6px;margin:0;padding:0 0 5px;list-style:none;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#9b8e75 #e7dec9}
.targets:focus-visible{outline:2px solid #a66c20;outline-offset:2px}
.targets.compact{grid-auto-columns:minmax(70px,calc((100% - 24px)/4.4))}
.target{position:relative;text-align:center;background:var(--paper);border:1px solid var(--rim);border-radius:10px;padding:6px 2px;font-size:clamp(10px,2.9vw,13px);font-weight:700;min-width:0;line-height:1.18;word-break:keep-all;overflow-wrap:anywhere}
.target img{display:block;width:clamp(33px,10vw,53px);height:clamp(33px,10vw,53px);margin:0 auto 4px;object-fit:contain}
.target.found{background:#e5ecdf;border-color:#9baa91}.target.found img{opacity:.65}.check{position:absolute;right:4px;top:4px;border-radius:100%;background:var(--green);color:white;width:18px;line-height:18px;font-size:12px}


.round-actions{display:flex;justify-content:flex-end;margin-top:8px}
.targets.compact .target img{width:clamp(29px,8vw,42px);height:clamp(29px,8vw,42px)}
.home-cover{position:relative;overflow:hidden;border:1px solid #967a5e;border-radius:16px;margin:12px 0 10px;min-height:220px;height:clamp(220px,36svh,340px);isolation:isolate;background:#473424}
.home-cover img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:50% 43%;z-index:-2}
.home-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#252618e8,#30271d8a 53%,#2b231c05);z-index:-1}
.home-cover-copy{display:grid;align-content:end;justify-items:start;height:100%;padding:clamp(15px,5vw,29px);gap:13px;color:#fffbef}
.home-cover h2{font-size:clamp(25px,7vw,39px);line-height:1.19;letter-spacing:-.06em;text-shadow:0 2px 8px #221a13}
.home-cover .primary{background:#ffefd0;border-color:#ffefd0;color:#2b4032}
.album-link,.stage-card{display:flex;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rim);border-radius:10px;font-weight:700}
.album-link{padding:12px 13px;justify-content:space-between}
#album-count,.stage-card small{font-size:12px;color:var(--muted)}
.list-heading{margin:14px 0 8px;font-size:18px}.stage-list{display:grid;gap:6px}
.stage-card{padding:5px 9px 5px 5px;gap:9px;font-size:14px}
.stage-card img{width:52px;height:42px;object-fit:cover;object-position:center 46%;border-radius:6px}
.stage-card small{margin-left:auto}
#postcards{display:grid;gap:11px}
#postcards article,#album-empty{padding:12px;background:var(--paper);border:1px solid var(--rim);border-radius:13px}
#postcards p,#album-empty{font-size:14px;line-height:1.55}
.postcard{display:block;width:100%;height:min(35vh,230px);object-fit:cover;object-position:center 47%;border:4px solid #fff;border-radius:7px;margin-bottom:7px}
.effect,.hint-box{position:absolute;pointer-events:none}
.effect{width:23px;height:23px;z-index:1;transform:translate(-50%,-50%);border-radius:50%;animation:fade .58s ease-out forwards}.correct{border:3px solid #d51824;box-shadow:0 0 0 1px #fff9}.miss::before,.miss::after{content:"";position:absolute;left:50%;top:50%;width:23px;height:3px;background:#d51824;border-radius:2px;box-shadow:0 0 0 1px #fff9;transform:translate(-50%,-50%) rotate(45deg)}.miss::after{transform:translate(-50%,-50%) rotate(-45deg)}
.hint-box{border:2px solid #ffeb9d;background:#ffe8a32e;border-radius:10px;box-shadow:0 0 0 1px #47311877;animation:hint 3.2s forwards}
@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
@keyframes hint{0%,18%,80%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.effect,.hint-box{animation-name:none}}
[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<main>
  <header>
    <h1>숲마을에서 온 엽서</h1>
    <a class="pill arcade-home" id="arcade-home" href="https://dads-arcade.snugbrink3.chatgpt.site/">아빠네 오락실</a>
    <button class="pill" id="home-button" hidden>메인으로</button>
  </header>
  <section id="home-screen" aria-labelledby="home-title">
    <div class="home-cover">
      <img id="home-art" alt="">
      <div class="home-cover-copy">
        <h2 id="home-title" tabindex="-1">작은 동물들의<br>숨은그림찾기</h2>
        <button class="primary" id="continue">시작하기</button>
      </div>
    </div>
    <button class="album-link" id="album-open"><span>엽서 보기</span><span id="album-count">0/10</span></button>
    <h2 class="list-heading">장소 선택</h2>
    <div class="stage-list" id="stage-list"></div>
  </section>
  <section id="game-screen" aria-labelledby="location-title" hidden>
    <div class="location"><h2 id="location-title" tabindex="-1">나뭇잎 우체국</h2><p><strong id="progress"></strong></p></div>
    <div class="scene" id="scene">
      <div class="world" id="world"><img id="art" alt="" draggable="false"></div>
      <div class="zoom" aria-label="그림 확대 조절"><button id="minus" aria-label="축소">−</button><button id="plus" aria-label="확대">+</button><button id="fit">전체</button></div>
    </div>
    <div class="toolbar"><p id="instructions">그림에서 물건을 눌러 찾으세요.<br>두 손가락으로 확대할 수 있어요.</p><button class="pill" id="hint">구역 힌트 <span id="hint-count"></span></button></div>
    <ul aria-label="찾을 물건" class="targets" id="targets" tabindex="0"></ul>
    <div class="round-actions">
      <button class="primary" id="next-round" hidden></button>
    </div>
    <p id="status" class="sr" role="status"></p>
    <p id="save-warning" hidden>이 브라우저에서 진행 상태를 저장할 수 없습니다.</p>
  </section>
  <section id="album-screen" aria-labelledby="album-title" hidden>
    <h2 class="list-heading" id="album-title" tabindex="-1">엽서 보기</h2>
    <div id="postcards"></div>
    <p id="album-empty">장소의 물건을 모두 찾으면 엽서를 받습니다.</p>
  </section>
</main>
<script src="./tea-room.js"></script>
<script src="./ant-market.js"></script>
<script src="./moss-garden.js"></script>
<script src="./firefly-stop.js"></script>

const legacyStageCount = stages.filter(stage => Number.isInteger(stage.count)).length;
let artSize = stages[0];
const find = id => document.getElementById(id);
const scene = find('scene');
const world = find('world');
let screen = 'home';
const saveKey = 'forest-postcards.post-office.v2';
const legacySaveKey = 'forest-postcards.post-office.v1';
const hintLimit = 3;
const maxScale = 3;
const state = { stage: 0, found: stages.map(() => []), hints: stages.map(() => 0), legacyPostcards: 0 };
let camera = { width: 0, height: 0, scale: 1, x: 0, y: 0 };
let hintMarker;
let hintCursor = 0;
const objects = new Map();

function stageUnlocked(index) {
  const alreadyUnlocked = Math.min(state.legacyPostcards, legacyStageCount - 1);
  return Boolean(stages[index]) &&
    stages.slice(alreadyUnlocked, index).every((_, offset) => complete(alreadyUnlocked + offset));
}

function earnedPostcard(index) {
  return index < state.legacyPostcards || complete(index);
}

function mountStage() {
  artSize = stages[state.stage];
  const art = find('art');
  art.src = artSize.art;
  art.alt = artSize.alt;
  world.replaceChildren(art);
  objects.clear();
  for (const item of artSize.items) {
    const [left, top, right, bottom, image] = item.patch ?? [...item.spriteBox, item.icon];
    const sprite = new Image();
    sprite.alt = '';
    sprite.src = image;
    const object = item.patch ? sprite : document.createElement('div');
    object.className = 'scene-object';
    Object.assign(object.style, {
      left: `${left / artSize.width * 100}%`,
      top: `${top / artSize.height * 100}%`,
      width: `${(right - left) / artSize.width * 100}%`,
      height: `${(bottom - top) / artSize.height * 100}%`,
    });
    if (!item.patch) {
      object.className += ' placed-object';
      sprite.style.filter = artSize.lighting;
      if (item.hiddenByRim) {
        object.style.clipPath = `inset(-8% -15% ${item.hiddenByRim}% -15%)`;
      } else {
        const shadow = document.createElement('span');
        shadow.className = 'contact-shadow';
        object.append(shadow);
      }
      object.append(sprite);
    }
    world.append(object);
    objects.set(item.id, object);
  }
}

function renderObjects() {
  const found = state.found[state.stage];
  for (const item of artSize.items) {
    const isFound = found.includes(item.id);
    objects.get(item.id).hidden = item.patch ? !isFound : isFound;
  }
}

function sanitizeHints(value) {
  return Number.isInteger(value) ? Math.max(0, Math.min(value, hintLimit)) : 0;
}

function readFound(value) {
  return new Set(Array.isArray(value) ? value : []);
}

function load() {
  try {
    const current = JSON.parse(localStorage.getItem(saveKey));
    const stored = current ?? JSON.parse(localStorage.getItem(legacySaveKey));
    if (!stored) return;

    if (current) state.legacyPostcards = Number.isInteger(stored.legacyPostcards)
      ? Math.max(0, Math.min(stored.legacyPostcards, legacyStageCount)) : 0;

    stages.forEach(({ items, count }, index) => {
      const slot = current ? index : index * 2;
      const first = readFound(stored.found?.[slot]);
      const second = readFound(current ? undefined : stored.found?.[slot + 1]);
      state.found[index] = items.filter(({ id }) => first.has(id) || second.has(id)).map(({ id }) => id);
      const firstHints = sanitizeHints(stored.hints?.[slot]);
      const secondHints = current ? 0 : sanitizeHints(stored.hints?.[slot + 1]);
      state.hints[index] = Math.min(hintLimit, firstHints + secondHints);

      // Old saves earned the postcard and the next location after the first half.
      if (!current && count && index === state.legacyPostcards && items.slice(0, count).every(({ id }) => first.has(id))) {
        state.legacyPostcards++;
      }
    });

    const index = current ? stored.stage : Math.floor(stored.phase / 2);
    if (Number.isInteger(index) && stageUnlocked(index)) state.stage = index;
  } catch {
    find('save-warning').hidden = false;
  }
}

function save() {
  try {
    localStorage.setItem(saveKey, JSON.stringify(state));
  } catch {
    find('save-warning').hidden = false;
  }
}

function complete(index) {
  return state.found[index].length === stages[index].items.length;
}

function render() {
  const done = complete(state.stage);
  const count = artSize.items.length;
  renderObjects();
  find('location-title').textContent = artSize.title;
  find('progress').textContent = `${state.found[state.stage].length}/${count}`;
  find('hint-count').textContent = `${hintLimit - state.hints[state.stage]}/${hintLimit}`;
  find('hint').disabled = done || state.hints[state.stage] >= hintLimit;
  find('instructions').innerHTML = done
    ? '모든 물건을 찾았어요. 엽서 앨범에서 이 장소를 볼 수 있어요.'
    : '그림에서 물건을 눌러 찾으세요.<br>두 손가락으로 확대할 수 있어요.';
  const next = state.stage + 1;
  const canAdvance = done && next < stages.length;
  find('next-round').hidden = !canAdvance;
  find('next-round').textContent = canAdvance ? `${stages[next].title} 가기` : '';
  const targets = find('targets');
  const trayOffset = targets.scrollLeft;
  targets.classList.toggle('compact', count > 4);
  targets.replaceChildren(...artSize.items.map(item => {
    const found = state.found[state.stage].includes(item.id);
    const tile = document.createElement('li');
    tile.className = found ? 'target found' : 'target';
    const icon = new Image();
    icon.src = item.icon;
    icon.alt = '';
    icon.draggable = false;
    tile.append(icon, item.name);
    if (found) {
      const check = document.createElement('span');
      check.className = 'check';
      check.setAttribute('aria-hidden', 'true');
      check.textContent = '✓';
      const note = document.createElement('span');
      note.className = 'sr';
      note.textContent = ' 찾음';
      tile.append(check, note);
    }
    return tile;
  }));
  targets.scrollLeft = trayOffset;
}

function renderHome() {
  const postcardCount = stages.filter((_, index) => earnedPostcard(index)).length;
  find('album-count').textContent = `${postcardCount}/${stages.length}`;
  const hasProgress = state.found.some(found => found.length) || state.hints.some(Boolean);
  find('continue').textContent = hasProgress ? '이어하기' : '시작하기';
  find('stage-list').replaceChildren(...stages.map((stage, index) => {
    const unlocked = stageUnlocked(index);
    const card = document.createElement('button');
    card.className = 'stage-card';
    card.disabled = !unlocked;
    card.onclick = () => visitStage(index);
    const thumb = new Image();
    thumb.src = stage.art;
    thumb.alt = '';
    const label = document.createElement('span');
    label.textContent = stage.title;
    const detail = document.createElement('small');
    detail.textContent = !unlocked ? '잠김' : complete(index) ? '완료'
      : state.found[index].length ? '진행 중' : '입장';
    card.append(thumb, label, detail);
    return card;
  }));
}

function renderAlbum() {
  const earned = stages.filter((_, index) => earnedPostcard(index));
  find('postcards').replaceChildren(...earned.map(stage => {
    const card = document.createElement('article');
    const photo = new Image();
    photo.className = 'postcard';
    photo.src = stage.art;
    photo.alt = stage.alt;
    const title = document.createElement('strong');
    title.textContent = stage.title;
    const caption = document.createElement('p');
    caption.textContent = `“${stage.caption}”`;
    card.append(photo, title, caption);
    return card;
  }));
  find('album-empty').hidden = earned.length > 0;
}

function showScreen(next, moveFocus = true) {
  screen = next;
  for (const name of ['home', 'game', 'album']) find(`${name}-screen`).hidden = screen !== name;
  find('home-button').hidden = screen === 'home';
  find('arcade-home').hidden = screen !== 'home';
  if (screen === 'home') renderHome();
  if (screen === 'album') renderAlbum();
  if (screen === 'game') {
    resetCamera();
    render();
  } else {
    clearHint();
  }
  const heading = { home: 'home-title', game: 'location-title', album: 'album-title' }[screen];
  if (moveFocus) find(heading).focus();
}

function visitStage(index) {
  if (!stageUnlocked(index)) return;
  if (index !== state.stage) {
    state.stage = index;
    find('targets').scrollLeft = 0;
    hintCursor = 0;
    clearHint();
    mountStage();
    save();
  }
  showScreen('game');
}

function bound(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function draw() {
  const width = camera.width * camera.scale;
  const height = camera.height * camera.scale;
  const availableWidth = scene.clientWidth;
  const availableHeight = scene.clientHeight;
  camera.x = width <= availableWidth ? (availableWidth - width) / 2
    : bound(camera.x, availableWidth - width, 0);
  camera.y = height <= availableHeight ? (availableHeight - height) / 2
    : bound(camera.y, availableHeight - height, 0);
  world.style.transform = `translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;
  find('plus').disabled = camera.scale >= maxScale;
  find('minus').disabled = camera.scale <= 1;
  find('fit').disabled = camera.scale <= 1;
}

function resetCamera() {
  const fit = Math.min(scene.clientWidth / artSize.width, scene.clientHeight / artSize.height);
  camera = { width: artSize.width * fit, height: artSize.height * fit, scale: 1, x: 0, y: 0 };
  world.style.width = `${camera.width}px`;
  world.style.height = `${camera.height}px`;
  draw();
}

function zoomAt(scale, before, after = before) {
  const next = bound(scale, 1, maxScale);
  const factor = next / camera.scale;
  camera.x = after.x - (before.x - camera.x) * factor;
  camera.y = after.y - (before.y - camera.y) * factor;
  camera.scale = next;
  draw();
}

function center() {
  return { x: scene.clientWidth / 2, y: scene.clientHeight / 2 };
}

function local(event) {
  const box = scene.getBoundingClientRect();
  return { x: event.clientX - box.left - scene.clientLeft, y: event.clientY - box.top - scene.clientTop };
}

function showEffect(point, correct) {
  const effect = document.createElement('span');
  effect.className = correct ? 'effect correct' : 'effect miss';
  effect.style.left = `${point.x}px`;
  effect.style.top = `${point.y}px`;
  effect.setAttribute('aria-hidden', 'true');
  scene.append(effect);
  setTimeout(() => effect.remove(), 600);
}

function insideOutline(x, y, outline) {
  let inside = false;
  let [lastX, lastY] = outline[outline.length - 1];
  for (const [vx, vy] of outline) {
    if ((vy > y) !== (lastY > y) && x < (lastX - vx) * (y - vy) / (lastY - vy) + vx) inside = !inside;
    [lastX, lastY] = [vx, vy];
  }
  return inside;
}

function tap(point) {
  if (complete(state.stage)) return;
  const x = ((point.x - camera.x) / (camera.width * camera.scale)) * artSize.width;
  const y = ((point.y - camera.y) / (camera.height * camera.scale)) * artSize.height;
  if (x < 0 || y < 0 || x > artSize.width || y > artSize.height) return;
  const item = artSize.items.find(({ id, hit: [left, top, right, bottom], outline }) => {
    if (state.found[state.stage].includes(id) || x < left || x > right || y < top || y > bottom) return false;
    if (outline) return insideOutline(x, y, outline);
    if (id !== 'quill') return true;
    const featherCenter = 769 + 0.56 * (x - 107);
    return Math.abs(y - featherCenter) <= (x < 225 ? 40 : 25);
  });
  if (!item) {
    showEffect(point, false);
    return;
  }
  state.found[state.stage].push(item.id);
  if (hintMarker?.dataset.item === item.id) clearHint();
  save();
  render();
  showEffect(point, true);
  find('status').textContent = `${item.name} 발견! ${state.found[state.stage].length}/${artSize.items.length}`;
}

function clearHint() {
  hintMarker?.remove();
  hintMarker = undefined;
}

function hint() {
  if (find('hint').disabled) return;
  const remaining = artSize.items.filter(item => !state.found[state.stage].includes(item.id));
  const item = remaining[hintCursor % remaining.length];
  hintCursor += 1;
  state.hints[state.stage] += 1;
  save();
  render();
  clearHint();
  if (camera.scale !== 1) resetCamera();
  const [left, top, right, bottom] = item.zone;
  const marker = document.createElement('span');
  marker.className = 'hint-box';
  marker.dataset.item = item.id;
  Object.assign(marker.style, {
    left: `${left / artSize.width * 100}%`, top: `${top / artSize.height * 100}%`,
    width: `${(right - left) / artSize.width * 100}%`, height: `${(bottom - top) / artSize.height * 100}%`,
  });
  world.append(marker);
  hintMarker = marker;
  find('status').textContent = `힌트 구역은 ${item.area}입니다. 남은 힌트 ${hintLimit - state.hints[state.stage]}회.`;
  setTimeout(() => {
    if (hintMarker === marker) clearHint();
  }, 3200);
}

const pointers = new Map();
let tapCandidate = null;

function pair(points) {
  const [a, b] = points;
  return { center: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
    distance: Math.hypot(b.x - a.x, b.y - a.y) };
}

scene.addEventListener('pointerdown', event => {
  if (event.target.closest('button') || event.button !== 0) return;
  const point = local(event);
  pointers.set(event.pointerId, point);
  scene.setPointerCapture(event.pointerId);
  tapCandidate = pointers.size === 1 ? { id: event.pointerId, start: point } : null;
});

scene.addEventListener('pointermove', event => {
  const last = pointers.get(event.pointerId);
  if (!last) return;
  const point = local(event);
  if (pointers.size === 2) {
    const before = pair([...pointers.values()]);
    pointers.set(event.pointerId, point);
    const after = pair([...pointers.values()]);
    if (before.distance > 0) zoomAt(camera.scale * after.distance / before.distance, before.center, after.center);
    return;
  }
  pointers.set(event.pointerId, point);
  if (pointers.size !== 1) return;
  let origin = last;
  if (tapCandidate) {
    const start = tapCandidate.start;
    if (Math.hypot(point.x - start.x, point.y - start.y) <= 7) return;
    tapCandidate = null;
    origin = start;
  }
  camera.x += point.x - origin.x;
  camera.y += point.y - origin.y;
  draw();
});

function endPointer(event) {
  if (!pointers.has(event.pointerId)) return;
  pointers.delete(event.pointerId);
  if (tapCandidate?.id !== event.pointerId) return;
  const { start } = tapCandidate;
  tapCandidate = null;
  if (event.type !== 'pointerup') return;
  const point = local(event);
  if (Math.hypot(point.x - start.x, point.y - start.y) <= 7) tap(point);
}

for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  scene.addEventListener(name, endPointer);
}
find('plus').onclick = () => zoomAt(camera.scale * 1.5, center());
find('minus').onclick = () => zoomAt(camera.scale / 1.5, center());
find('fit').onclick = resetCamera;
find('hint').onclick = hint;
find('home-art').src = sceneArt;
find('home-button').onclick = () => showScreen('home');
find('album-open').onclick = () => showScreen('album');
find('continue').onclick = () => visitStage(state.stage);
find('next-round').onclick = () => visitStage(state.stage + 1);
new ResizeObserver(() => {
  if (screen === 'game') resetCamera();
}).observe(scene);
load();
mountStage();
showScreen('home', false);
</script>
</body>
</html>
